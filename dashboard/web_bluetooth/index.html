<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0; padding: 0;
    font-family: 'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
    background: transparent; color: #14201E;
  }
  #wrap { padding: 4px 0; }
  button {
    font-family: inherit; font-weight: 600; font-size: 0.85rem;
    padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
    background: #10262B; color: #E7EFEC; width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { background: #0a1e21; }
  #status { font-size: 0.78rem; margin-top: 6px; color: rgba(20,32,30,0.65); }
  #status.err { color: #c4243f; }
  #status.ok { color: #17703f; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <button id="pair-btn">📶 Pair a device (this browser's Bluetooth)</button>
  <div id="status">Not connected.</div>
</div>
<script>
// --- Minimal hand-rolled Streamlit Components v1 protocol ---
// (No external JS/CDN dependency, so this keeps working even if
// streamlit-component-lib's CDN copy ever changes or is unreachable.)
function sendToStreamlit(type, extra) {
  window.parent.postMessage(Object.assign({
    isStreamlitMessage: true, type: type,
  }, extra || {}), "*");
}
function setValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}
function setHeight() {
  sendToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight });
}
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
window.addEventListener("message", (event) => {
  if (event.data && event.data.type === "streamlit:render") setHeight();
});
setHeight();

// --- Web Bluetooth: read live heart rate using THIS browser's adapter ---
const HR_SERVICE = "heart_rate";              // Web Bluetooth's alias for 0x180D
const HR_MEASUREMENT = "heart_rate_measurement"; // alias for 0x2A37

const btn = document.getElementById("pair-btn");
const statusEl = document.getElementById("status");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
  setHeight();
}

function parseHrMeasurement(dataView) {
  const flags = dataView.getUint8(0);
  const is16bit = flags & 0x01;
  return is16bit ? dataView.getUint16(1, /* littleEndian= */ true) : dataView.getUint8(1);
}

if (!navigator.bluetooth) {
  btn.disabled = true;
  setStatus(
    "Web Bluetooth isn't available in this browser. Use Chrome or Edge over HTTPS " +
    "(or localhost).", "err"
  );
} else {
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    setStatus("Opening the browser's device picker…");
    try {
      const device = await navigator.bluetooth.requestDevice({
        // Show every nearby device in the browser's picker — not just ones
        // advertising the Heart Rate service — so a watch can be selected
        // even if it turns out not to share heart-rate data (e.g. it only
        // exposes a proprietary service). optionalServices is still
        // required to be allowed to read heart_rate afterwards if present.
        acceptAllDevices: true,
        optionalServices: [HR_SERVICE],
      });
      setStatus(`Connecting to ${device.name || "device"}…`);

      device.addEventListener("gattserverdisconnected", () => {
        setStatus(`Disconnected from ${device.name || "device"}.`, "err");
        btn.disabled = false;
        setValue({ status: "disconnected", device_name: device.name || null });
      });

      const server = await device.gatt.connect();

      let service;
      try {
        service = await server.getPrimaryService(HR_SERVICE);
      } catch (svcErr) {
        setStatus(
          `Connected to ${device.name || "device"}, but it doesn't expose the standard ` +
          "Heart Rate service — its heart-rate data (if any) uses a proprietary format " +
          "this app can't read. See docs/live_watch.md.", "err"
        );
        setValue({
          status: "error", device_name: device.name || null,
          error: "No standard Heart Rate service on this device.",
        });
        btn.disabled = false;
        device.gatt.disconnect();
        return;
      }
      const characteristic = await service.getCharacteristic(HR_MEASUREMENT);
      await characteristic.startNotifications();

      characteristic.addEventListener("characteristicvaluechanged", (event) => {
        const hr = parseHrMeasurement(event.target.value);
        setValue({
          status: "connected",
          device_name: device.name || null,
          heart_rate: hr,
          ts: Date.now(),
        });
      });

      setStatus(`Connected — ${device.name || "device"}. Waiting for the first reading…`, "ok");
      setValue({ status: "connected", device_name: device.name || null });
    } catch (err) {
      setStatus(`Error: ${err.message || err}`, "err");
      setValue({ status: "error", error: String(err.message || err) });
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
